
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: door_test
      POSTGRES_PASSWORD: door_test
      POSTGRES_DB: door_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U door_test -d door_test"]
      interval: 1s
      timeout: 3s
      retries: 30
