; ESP32 Smart Door firmware — PlatformIO project.
; Wiring and the order to run the test envs: docs/esp32-smart-door/Hardware Setup Guide.md

[platformio]
default_envs = app

; Shared by every env below
[env]
platform = espressif32@^6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.0
  madhephaestus/ESP32Servo@^3.0.6
  bblanchon/ArduinoJson@^7.4.2

; The real door firmware (src/app/): scans, dashboard unlock, dashboard enrollment.
[env:app]
build_src_filter = -<*> +<app/>

; ---- Hardware tests: run in this order (Hardware Setup Guide §4) ----

[env:test-blink]
build_src_filter = -<*> +<hwtests/blink.cpp>

[env:test-oled]
build_src_filter = -<*> +<hwtests/oled.cpp>

[env:test-leds-buzzer]
build_src_filter = -<*> +<hwtests/leds_buzzer.cpp>

[env:test-fingerprint]
build_src_filter = -<*> +<hwtests/fingerprint.cpp>

[env:test-servo]
build_src_filter = -<*> +<hwtests/servo.cpp>

[env:test-relay]
build_src_filter = -<*> +<hwtests/relay.cpp>

[env:test-unlock-sequence]
build_src_filter = -<*> +<hwtests/unlock_sequence.cpp>

; One-time: clears the sensor before enrolling from the dashboard (Hardware Setup Guide 5b)
[env:wipe-fingerprints]
build_src_filter = -<*> +<hwtests/wipe_fingerprints.cpp>
